name: Release with Assets Triggered by a Tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "tag name"
        required: true
        default: "0.1.0-1"

env:
  TITLE: hello-deb
  PACKAGE: hello-deb
  TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts jq

      - name: Verify changelog is released
        run: |
          DIST="$(dpkg-parsechangelog -S distribution)"

          if [ "${DIST}" != "RELEASED" ]; then
            echo "Top changelog entry is not RELEASED" >&2
            echo "Found distribution: ${DIST}" >&2
            exit 1
          fi

      - name: Build package
        run: |
          RELEASE_TMP_DIR="$RUNNER_TEMP/hello-deb-release"
          mkdir -p "$RELEASE_TMP_DIR"

          dpkg-buildpackage -us -uc -b
          cp ../*.deb "$RELEASE_TMP_DIR/"

      - name: Extract release notes from debian/changelog
        id: release_notes
        run: |
          RELEASE_NOTES_FILE="$RUNNER_TEMP/release_notes.txt"
          VERSION="${TAG}"
          SECTION_START="$(grep -n "^${PACKAGE} (${VERSION}) " debian/changelog | head -1 | cut -d: -f1)"

          if [ -z "$SECTION_START" ]; then
            echo "Could not find version ${VERSION} in debian/changelog" >&2
            exit 1
          fi

          tail -n +"$((SECTION_START + 1))" debian/changelog \
            | awk '/^ -- / { exit } { print }' \
            | sed "s/^  \\* /- /" \
            | sed "/^$/d" \
            > "$RELEASE_NOTES_FILE"

          if [ ! -s "$RELEASE_NOTES_FILE" ]; then
            echo "Release notes for ${VERSION} are empty" >&2
            exit 1
          fi

          RELEASE_NOTES_B64="$(base64 < "$RELEASE_NOTES_FILE" | tr -d "\n")"
          echo "release_notes_b64=$RELEASE_NOTES_B64" >> "$GITHUB_OUTPUT"

      - name: Create a Release and Upload Assets
        run: |
          RELEASE_TMP_DIR="$RUNNER_TEMP/hello-deb-release"
          echo "${{ steps.release_notes.outputs.release_notes_b64 }}" | base64 -d > release_notes.txt
          NOTES="$(cat release_notes.txt)"
          API_URL="https://api.github.com/repos/${{ github.repository }}"

          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${API_URL}/releases/tags/${TAG}" \
            -o existing_release.json || true

          if [ -s existing_release.json ] && [ "$(jq -r .id existing_release.json)" != "null" ]; then
            RELEASE_ID="$(jq -r .id existing_release.json)"
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                   --arg tag_name "${TAG}" \
                   --arg name "${TITLE} ${TAG}" \
                   --arg body "$NOTES" \
                  '{ tag_name: $tag_name, name: $name, body: $body }')" \
              "${API_URL}/releases" \
              -o release.json

            if [ "$(jq -r .id release.json)" = "null" ]; then
              echo "Failed to create release" >&2
              cat release.json >&2
              exit 1
            fi

            RELEASE_ID="$(jq -r .id release.json)"
          fi

          for FILE in "$RELEASE_TMP_DIR"/*.deb; do
            ASSET_NAME="$(basename "$FILE")"

            EXISTING_ASSET_ID="$(
              curl -fsS \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/json" \
                "${API_URL}/releases/${RELEASE_ID}/assets" \
                | jq -r --arg name "${ASSET_NAME}" '.[] | select(.name == $name) | .id'
            )"

            if [ -n "${EXISTING_ASSET_ID}" ]; then
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "${API_URL}/releases/assets/${EXISTING_ASSET_ID}"
            fi

            UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}"

            curl -fsS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.debian.binary-package" \
              --data-binary @"$FILE" \
              "${UPLOAD_URL}"
          done
