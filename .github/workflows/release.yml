name: Release with Assets Triggered by a Tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "tag name"
        required: true
        default: "0.1.0-1"

env:
  TITLE: hello-deb
  PACKAGE: hello-deb
  TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts jq

      - name: Verify changelog is released
        run: |
          DIST="$(dpkg-parsechangelog -S distribution)"

          if [ "${DIST}" != "RELEASED" ]; then
            echo "Top changelog entry is not RELEASED" >&2
            echo "Found distribution: ${DIST}" >&2
            exit 1
          fi

      - name: Build package
        run: |
          RELEASE_TMP_DIR="$RUNNER_TEMP/hello-deb-release"
          mkdir -p "$RELEASE_TMP_DIR"

          dpkg-buildpackage -us -uc -b
          cp ../*.buildinfo "$RELEASE_TMP_DIR/"
          cp ../*.changes "$RELEASE_TMP_DIR/"
          cp ../*.deb "$RELEASE_TMP_DIR/"

      - name: Extract release notes from debian/changelog
        id: release_notes
        run: |
          dpkg-parsechangelog -SChanges \
            | sed '1d' \
            | sed '/^\.$/d' \
            | sed 's/^  *//g' \
            | sed '/^$/d' \
            > /tmp/release_notes_temp.txt

          if [[ ! -s /tmp/release_notes_temp.txt ]]; then
            echo "Package release for version ${TAG}" > /tmp/release_notes_temp.txt
          fi

      - name: Create a Release and Upload Assets
        run: |
          RELEASE_TMP_DIR="$RUNNER_TEMP/hello-deb-release"

          NOTES="/tmp/release_notes_temp.txt"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                 --arg tag_name "${{ env.TAG }}" \
                 --arg name "${{ env.TITLE }} ${{ env.TAG }}" \
                 --rawfile body "$NOTES" \
                 '{ tag_name: $tag_name, name: $name, body: $body }')" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -o release.json

          if [[ "$(jq -r .id release.json)" == "null" ]]; then
            echo "Failed to create release"
            cat release.json
            exit 1
          fi

          RELEASE_ID="$(jq -r .id release.json)"

          for FILE in "$RELEASE_TMP_DIR"/*; do
            ASSET_NAME="$(basename "$FILE")"
            UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}"

            curl -fsS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "${UPLOAD_URL}"
          done

      - name: Clean build staging directory
        if: always()
        run: |
          dh clean
          rm -rf dist
          rm -f ./data-store release.json release_notes.txt
          rm -f ../*.deb ../*.buildinfo ../*.changes
